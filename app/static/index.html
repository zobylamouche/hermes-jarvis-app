<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JARVIS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { --cy: #00e5ff; --dim: #0a3a44; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body {
  background: radial-gradient(ellipse at 50% -20%, #0d2330 0%, #050a0f 60%, #020407 100%);
  color:#cfeef5; font-family:'Segoe UI',system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  user-select:none;
}
header {
  padding:14px 16px 8px; text-align:center; position:relative;
  letter-spacing:4px; font-weight:300;
}
header .t { font-size:22px; color:var(--cy); text-shadow:0 0 12px var(--cy); }
header .s { font-size:10px; color:#5a8a96; letter-spacing:2px; margin-top:2px; }

/* ARC REACTOR */
.reactor { width:110px; height:110px; margin:10px auto 6px; position:relative; }
.reactor .ring {
  position:absolute; inset:0; border-radius:50%;
  border:2px solid rgba(0,229,255,.25);
  box-shadow:0 0 18px rgba(0,229,255,.15), inset 0 0 18px rgba(0,229,255,.08);
  animation: spin 14s linear infinite;
}
.reactor .ring.r2 { inset:12px; border-color:rgba(0,229,255,.4); animation-duration:9s; animation-direction:reverse; }
.reactor .core {
  position:absolute; inset:32px; border-radius:50%;
  background: radial-gradient(circle, #e8fdff 0%, var(--cy) 45%, #007c8f 100%);
  box-shadow:0 0 26px var(--cy), 0 0 60px rgba(0,229,255,.35);
  animation: pulse 2.4s ease-in-out infinite;
}
.reactor .seg { position:absolute; inset:6px; border-radius:50%;
  border:3px solid transparent; border-top-color:var(--cy);
  animation: spin 3.2s linear infinite; }
.reactor .seg.s2 { inset:6px; border-top-color:transparent; border-left-color:rgba(0,229,255,.5); animation-duration:5s; animation-direction:reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity:.85; } 50% { opacity:1; box-shadow:0 0 34px var(--cy),0 0 80px rgba(0,229,255,.45); } }
.status { font-size:11px; letter-spacing:2px; color:#5a8a96; margin-bottom:8px; min-height:14px; }
.status.listen { color:#7fff9e; text-shadow:0 0 8px #7fff9e; }
.status.think  { color:#ffd166; text-shadow:0 0 8px #ffd166; }

/* LOG */
#log { flex:1; overflow-y:auto; padding:6px 14px 10px; }
.msg { margin:8px 0; max-width:88%; animation: fade .3s; }
@keyframes fade { from { opacity:0; transform:translateY(6px); } }
.msg.me { margin-left:auto; text-align:right; }
.msg .bubble {
  display:inline-block; padding:9px 13px; border-radius:14px; font-size:14.5px;
  line-height:1.45; white-space:pre-wrap; word-break:break-word; text-align:left;
}
.msg.me .bubble { background:linear-gradient(135deg,#0b2d38,#0e3946); border:1px solid rgba(0,229,255,.25); border-bottom-right-radius:4px; }
.msg.jarvis .bubble { background:rgba(0,229,255,.07); border:1px solid rgba(0,229,255,.3); color:#e8fbff;
  border-bottom-left-radius:4px; box-shadow:0 0 10px rgba(0,229,255,.08); }
.msg .who { font-size:9.5px; color:#54707a; letter-spacing:1.5px; margin:3px 4px; }

/* CONTROLS */
.controls { padding:10px 14px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,transparent,rgba(2,4,7,.9) 40%); }
.microw { display:flex; align-items:center; gap:10px; }
#mic {
  width:58px; height:58px; border-radius:50%; border:2px solid rgba(0,229,255,.5);
  background:radial-gradient(circle,#0e2e38,#07161d); color:var(--cy); font-size:24px;
  box-shadow:0 0 14px rgba(0,229,255,.2); flex:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#mic.rec { border-color:#ff5470; color:#ff5470; box-shadow:0 0 20px rgba(255,84,112,.5); animation:pulse 1.2s infinite; }
.inrow { flex:1; display:flex; gap:8px; }
#txt { flex:1; background:rgba(0,229,255,.05); border:1px solid rgba(0,229,255,.25); border-radius:22px;
  padding:12px 16px; color:#e8fbff; font-size:15px; outline:none; }
#txt:focus { border-color:var(--cy); box-shadow:0 0 10px rgba(0,229,255,.15); }
#send { width:44px; height:44px; border-radius:50%; border:1px solid rgba(0,229,255,.4);
  background:rgba(0,229,255,.1); color:var(--cy); font-size:18px; cursor:pointer; flex:none; }
::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:var(--dim); border-radius:2px; }
</style>
</head>
<body>
<header>
  <div class="t">J.A.R.V.I.S.</div>
  <div class="s">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
  <div class="reactor" id="reactor">
    <div class="ring"></div><div class="ring r2"></div>
    <div class="seg"></div><div class="seg s2"></div>
    <div class="core"></div>
  </div>
  <div class="status" id="status">SYSTÈME OPÉRATIONNEL</div>
</header>
<div id="log"></div>
<div class="controls">
  <div class="microw">
    <button id="mic" title="Maintenir pour parler">🎙</button>
    <div class="inrow">
      <input id="txt" placeholder="Parler à Jarvis…" autocomplete="off">
      <button id="send">➤</button>
    </div>
  </div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
if (tg.themeParams?.bg_color) document.body.style.background = tg.themeParams.bg_color;

const $ = id => document.getElementById(id);
const log = $('log'), status = $('status'), txt = $('txt');

const INIT = tg.initData || '';
function scroll() { log.scrollTop = log.scrollHeight; }
function statusTo(s, cls) { status.textContent = s; status.className = 'status ' + (cls||''); }
function addMsg(who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'me' ? 'me' : 'jarvis');
  d.innerHTML = `<div class="who">${who === 'me' ? 'MOI' : 'JARVIS'}</div><div class="bubble"></div>`;
  d.querySelector('.bubble').textContent = text;
  log.appendChild(d); scroll();
}

function headers() { return { 'Content-Type': 'application/json', 'X-Init-Data': INIT }; }

async function brain(text, bubble) {
  statusTo('TRAITEMENT…', 'think');
  bubble && addMsg('me', text);
  try {
    const r = await fetch('/api/chat', { method:'POST', headers: headers(), body: JSON.stringify({ text }) });
    if (r.status === 401) { addMsg('jarvis', '⚠️ Session Telegram invalide. Rouvre l\'app.'); return; }
    const j = await r.json();
    addMsg('jarvis', j.reply || '…');
  } catch (e) {
    addMsg('jarvis', '🔌 Connexion perdue. Réessaie.');
  }
  statusTo('SYSTÈME OPÉRATIONNEL');
}

$('send').onclick = () => { const v = txt.value.trim(); if (v) { txt.value = ''; brain(v, true); } };
txt.addEventListener('keydown', e => { if (e.key === 'Enter') $('send').onclick(); });

/* --- VOCALE : maintenir le micro pour parler --- */
let mediaRec = null, chunks = [], recStart = 0;
const mic = $('mic');

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRec = new MediaRecorder(stream);
    chunks = [];
    mediaRec.ondataavailable = e => chunks.push(e.data);
    mediaRec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const dur = Date.now() - recStart;
      if (dur < 700) { statusTo('TROP COURT — MAINTIENS LE BOUTON'); return; }
      const blob = new Blob(chunks, { type: mediaRec.mimeType || 'audio/webm' });
      sendVoice(blob);
    };
    mediaRec.start(); recStart = Date.now();
    mic.classList.add('rec'); statusTo('🎤 JARVIS ÉCOUTE…', 'listen');
  } catch (e) { statusTo('MICRO REFUSÉ — AUTORISE L\'ACCÈS'); }
}
function stopRec() {
  if (mediaRec && mediaRec.state === 'recording') { mediaRec.stop(); mic.classList.remove('rec'); }
}
mic.addEventListener('pointerdown', e => { e.preventDefault(); startRec(); });
mic.addEventListener('pointerup', stopRec);
mic.addEventListener('pointerleave', stopRec);

async function sendVoice(blob) {
  statusTo('TRANSCRIPTION…', 'think');
  const fd = new FormData();
  fd.append('file', blob, 'vocal.webm');
  try {
    const r = await fetch('/api/voice', { method:'POST', headers: { 'X-Init-Data': INIT }, body: fd });
    if (r.status === 401) { addMsg('jarvis', '⚠️ Session Telegram invalide.'); return; }
    const j = await r.json();
    addMsg('me', '🎤 ' + (j.transcription || '…'));
    statusTo('TRAITEMENT…', 'think');
    const r2 = await fetch('/api/chat', { method:'POST', headers: headers(), body: JSON.stringify({ text: j.transcription }) });
    const j2 = await r2.json();
    addMsg('jarvis', j2.reply || '…');
  } catch (e) { addMsg('jarvis', '🔌 Vocal perdu. Réessaie.'); }
  statusTo('SYSTÈME OPÉRATIONNEL');
}

addMsg('jarvis', `Bonjour ${tg.initDataUnsafe?.user?.first_name || ''} 🤖\nSystems online. Maintiens le micro pour me parler, ou écris.`);
statusTo('SYSTÈME OPÉRATIONNEL');
</script>
</body>
</html>

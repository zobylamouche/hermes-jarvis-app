<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JARVIS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { --cy: #00e5ff; --dim: #0a3a44; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body {
  background: radial-gradient(ellipse at 50% -20%, #0d2330 0%, #050a0f 60%, #020407 100%);
  color:#cfeef5; font-family:'Segoe UI',system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  user-select:none;
}
header {
  padding:14px 16px 8px; text-align:center; position:relative;
  letter-spacing:4px; font-weight:300;
}
header .t { font-size:22px; color:var(--cy); text-shadow:0 0 12px var(--cy); }
header .s { font-size:10px; color:#5a8a96; letter-spacing:2px; margin-top:2px; }

/* ARC REACTOR */
.reactor { width:110px; height:110px; margin:10px auto 6px; position:relative; }
.reactor .ring {
  position:absolute; inset:0; border-radius:50%;
  border:2px solid rgba(0,229,255,.25);
  box-shadow:0 0 18px rgba(0,229,255,.15), inset 0 0 18px rgba(0,229,255,.08);
  animation: spin 14s linear infinite;
}
.reactor .ring.r2 { inset:12px; border-color:rgba(0,229,255,.4); animation-duration:9s; animation-direction:reverse; }
.reactor .core {
  position:absolute; inset:32px; border-radius:50%;
  background: radial-gradient(circle, #e8fdff 0%, var(--cy) 45%, #007c8f 100%);
  box-shadow:0 0 26px var(--cy), 0 0 60px rgba(0,229,255,.35);
  animation: pulse 2.4s ease-in-out infinite;
}
.reactor .seg { position:absolute; inset:6px; border-radius:50%;
  border:3px solid transparent; border-top-color:var(--cy);
  animation: spin 3.2s linear infinite; }
.reactor .seg.s2 { inset:6px; border-top-color:transparent; border-left-color:rgba(0,229,255,.5); animation-duration:5s; animation-direction:reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity:.85; } 50% { opacity:1; box-shadow:0 0 34px var(--cy),0 0 80px rgba(0,229,255,.45); } }
.status { font-size:11px; letter-spacing:2px; color:#5a8a96; margin-bottom:8px; min-height:14px; }
.status.listen { color:#7fff9e; text-shadow:0 0 8px #7fff9e; }
.status.think  { color:#ffd166; text-shadow:0 0 8px #ffd166; }
#voice { position:absolute; top:12px; right:12px; width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(0,229,255,.35); background:rgba(0,229,255,.08); color:var(--cy);
  font-size:18px; cursor:pointer; }
#voicemodel { position:absolute; top:12px; right:64px; width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(0,229,255,.35); background:rgba(0,229,255,.08); color:var(--cy);
  font-size:17px; cursor:pointer; }
#stopvoice { position:absolute; top:12px; left:12px; width:44px; height:44px; border-radius:50%;
  border:1px solid #ff5470; background:rgba(255,84,112,.1); color:#ff5470;
  font-size:16px; cursor:pointer; display:none; }

/* LOG */
#log { flex:1; overflow-y:auto; padding:6px 14px 10px; }
.msg { margin:8px 0; max-width:88%; animation: fade .3s; }
@keyframes fade { from { opacity:0; transform:translateY(6px); } }
.msg.me { margin-left:auto; text-align:right; }
.msg .bubble {
  display:inline-block; padding:9px 13px; border-radius:14px; font-size:14.5px;
  line-height:1.45; white-space:pre-wrap; word-break:break-word; text-align:left;
}
.msg.me .bubble { background:linear-gradient(135deg,#0b2d38,#0e3946); border:1px solid rgba(0,229,255,.25); border-bottom-right-radius:4px; }
.msg.jarvis .bubble { background:rgba(0,229,255,.07); border:1px solid rgba(0,229,255,.3); color:#e8fbff;
  border-bottom-left-radius:4px; box-shadow:0 0 10px rgba(0,229,255,.08); }
.msg .who { font-size:9.5px; color:#54707a; letter-spacing:1.5px; margin:3px 4px; }

/* CONTROLS */
.controls { padding:10px 14px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,transparent,rgba(2,4,7,.9) 40%); }
.microw { display:flex; align-items:center; gap:10px; }
#mic {
  width:58px; height:58px; border-radius:50%; border:2px solid rgba(0,229,255,.5);
  background:radial-gradient(circle,#0e2e38,#07161d); color:var(--cy); font-size:24px;
  box-shadow:0 0 14px rgba(0,229,255,.2); flex:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#mic.rec { border-color:#ff5470; color:#ff5470; box-shadow:0 0 20px rgba(255,84,112,.5); animation:pulse 1.2s infinite; }
.inrow { flex:1; display:flex; gap:8px; }
#txt { flex:1; background:rgba(0,229,255,.05); border:1px solid rgba(0,229,255,.25); border-radius:22px;
  padding:12px 16px; color:#e8fbff; font-size:15px; outline:none; }
#txt:focus { border-color:var(--cy); box-shadow:0 0 10px rgba(0,229,255,.15); }
#send { width:44px; height:44px; border-radius:50%; border:1px solid rgba(0,229,255,.4);
  background:rgba(0,229,255,.1); color:var(--cy); font-size:18px; cursor:pointer; flex:none; }
#cont { width:44px; height:44px; border-radius:50%; border:1px solid rgba(0,229,255,.4);
  background:rgba(0,229,255,.1); color:var(--cy); font-size:18px; cursor:pointer; flex:none; }
#cont.rec { border-color:#ff5470; color:#ff5470; box-shadow:0 0 16px rgba(255,84,112,.45); }
::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:var(--dim); border-radius:2px; }
</style>
</head>
<body>
<header>
  <div class="t">J.A.R.V.I.S.</div>
  <div class="s">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
  <div class="reactor" id="reactor">
    <div class="ring"></div><div class="ring r2"></div>
    <div class="seg"></div><div class="seg s2"></div>
    <div class="core"></div>
  </div>
  <div class="status" id="status">SYSTÈME OPÉRATIONNEL</div>
  <button id="voice" title="Voix on/off">🔊</button>
  <button id="voicemodel" title="Changer de voix">🎚</button>
  <button id="stopvoice" title="Stopper la voix">⏹</button>
</header>
<div id="log"></div>
<div class="controls">
  <div class="microw">
    <button id="cont" title="Mode continu : écoute puis réponse après 2 s de silence">🎧</button>
    <button id="mic" title="Maintenir pour parler">🎙</button>
    <div class="inrow">
      <input id="txt" placeholder="Écrire à Jarvis…" autocomplete="off">
      <button id="send">➤</button>
    </div>
  </div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
if (tg.themeParams?.bg_color) document.body.style.background = tg.themeParams.bg_color;

const $ = id => document.getElementById(id);
const log = $('log'), status = $('status'), txt = $('txt');

const INIT = tg.initData || '';
function scroll() { log.scrollTop = log.scrollHeight; }
function statusTo(s, cls) { status.textContent = s; status.className = 'status ' + (cls||''); }

/* --- VOIX DE SORTIE (TTS local Piper) ---
   L'audio passe par un AudioContext déverrouillé au premier appui : le contexte
   créé pendant un geste utilisateur reste autorisé ensuite, donc Jarvis parle
   tout seul après un vocal, même si le geste est expiré depuis 10 s. */
let voiceOn = localStorage.getItem('jarvis_voice') !== '0';
const vbtn = $('voice');
vbtn.textContent = voiceOn ? '🔊' : '🔇';
vbtn.onclick = () => {
  voiceOn = !voiceOn;
  localStorage.setItem('jarvis_voice', voiceOn ? '1' : '0');
  vbtn.textContent = voiceOn ? '🔊' : '🔇';
  if (!voiceOn) statusTo('VOIX COUPÉE');
  else statusTo('VOIX ACTIVÉE');
};

let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, true);   // capture : avant le micro
document.addEventListener('touchstart', unlockAudio, { passive: true });

let curSrc = null, curAudio = null;
const sbtn = $('stopvoice');
function stopSpeaking() {
  if (curSrc) { try { curSrc.stop(); } catch (e) {} curSrc = null; }
  if (curAudio) { curAudio.pause(); curAudio = null; }
  sbtn.style.display = 'none';
  statusTo('SYSTÈME OPÉRATIONNEL');
}
sbtn.onclick = stopSpeaking;

/* --- SÉLECTEUR DE VOIX (Piper local) --- */
let VOICES = [];
let myVoice = localStorage.getItem('jarvis_voix') || 'fr_FR-siwis-medium';   // la plus naturelle
fetch('/api/voices', { headers: { 'X-Init-Data': INIT } })
  .then(r => r.ok ? r.json() : null)
  .then(j => { VOICES = (j && j.voices) || []; })
  .catch(() => {});
$('voicemodel').onclick = () => {
  if (!VOICES.length) { statusTo('AUCUNE AUTRE VOIX INSTALLÉE'); return; }
  const i = VOICES.indexOf(myVoice);
  myVoice = VOICES[(i + 1) % VOICES.length];
  localStorage.setItem('jarvis_voix', myVoice);
  statusTo('VOIX : ' + myVoice.replace(/^fr_FR-/, '').replace(/-(medium|low|x_low)$/i, '').toUpperCase());
};

async function speak(text, onDone) {
  if (!voiceOn || !text) { if (onDone) onDone(); return; }
  try {
    const r = await fetch('/api/tts', { method:'POST', headers: headers(), body: JSON.stringify({ text, voice: myVoice }) });
    if (!r.ok) { statusTo('VOIX INDISPONIBLE — RÉESSAIE', 'think'); if (onDone) onDone(); return; }
    const buf = await r.arrayBuffer();
    statusTo('JARVIS PARLE…', 'listen');
    sbtn.style.display = 'block';
    if (actx && actx.state === 'running') {
      const audio = await actx.decodeAudioData(buf);
      if (curSrc) { try { curSrc.stop(); } catch (e) {} }
      curSrc = actx.createBufferSource();
      curSrc.buffer = audio;
      curSrc.connect(actx.destination);
      curSrc.onended = () => { sbtn.style.display = 'none'; statusTo('SYSTÈME OPÉRATIONNEL'); if (onDone) onDone(); };
      curSrc.start();
    } else {
      // repli : élément Audio classique (nécessite un geste récent)
      const blob = new Blob([buf], { type: 'audio/wav' });
      if (curAudio) { curAudio.pause(); }
      curAudio = new Audio(URL.createObjectURL(blob));
      await curAudio.play();
      curAudio.onended = () => { sbtn.style.display = 'none'; statusTo('SYSTÈME OPÉRATIONNEL'); if (onDone) onDone(); };
    }
  } catch (e) {
    // autoplay refusé : la réponse affichée est cliquable pour l'entendre
    sbtn.style.display = 'none';
    statusTo("TOUCHE MA RÉPONSE POUR M'ENTENDRE", 'think');
    if (onDone) onDone();
  }
}

function addMsg(who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'me' ? 'me' : 'jarvis');
  d.innerHTML = `<div class="who">${who === 'me' ? 'MOI' : 'JARVIS'}</div><div class="bubble"></div>`;
  const bubble = d.querySelector('.bubble');
  bubble.textContent = text;
  if (who === 'jarvis') {
    bubble.style.cursor = 'pointer';
    bubble.title = 'Touche pour entendre';
    bubble.onclick = () => speak(text);
  }
  log.appendChild(d); scroll();
}

function headers() { return { 'Content-Type': 'application/json', 'X-Init-Data': INIT }; }

async function brain(text, bubble, onDone) {
  statusTo('TRAITEMENT…', 'think');
  bubble && addMsg('me', text);
  try {
    const r = await fetch('/api/chat', { method:'POST', headers: headers(), body: JSON.stringify({ text }) });
    if (r.status === 401) { addMsg('jarvis', '⚠️ Session Telegram invalide. Rouvre l\'app.'); if (onDone) onDone(); return; }
    const j = await r.json();
    const reply = (j.reply || '').trim();
    if (!reply) {
      addMsg('jarvis', "🤖 Je n'ai pas de réponse — reformule ?");
      statusTo('RÉPONSE VIDE', 'think');
      if (onDone) onDone();
      return;
    }
    addMsg('jarvis', reply);
    speak(reply, onDone);
  } catch (e) {
    addMsg('jarvis', '🔌 Connexion perdue. Réessaie.');
    if (onDone) onDone();
  }
  statusTo('SYSTÈME OPÉRATIONNEL');
}

$('send').onclick = () => { const v = txt.value.trim(); if (v) { txt.value = ''; brain(v, true); } };
txt.addEventListener('keydown', e => { if (e.key === 'Enter') $('send').onclick(); });

/* --- VOCALE : maintenir le micro pour parler --- */
let mediaRec = null, chunks = [], recStart = 0;
const mic = $('mic');

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRec = new MediaRecorder(stream);
    chunks = [];
    mediaRec.ondataavailable = e => chunks.push(e.data);
    mediaRec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const dur = Date.now() - recStart;
      if (dur < 700) { statusTo('TROP COURT — MAINTIENS LE BOUTON'); return; }
      const blob = new Blob(chunks, { type: mediaRec.mimeType || 'audio/webm' });
      sendVoice(blob);
    };
    mediaRec.start(); recStart = Date.now();
    mic.classList.add('rec'); statusTo('🎤 JARVIS ÉCOUTE…', 'listen');
  } catch (e) { statusTo('MICRO REFUSÉ — AUTORISE L\'ACCÈS'); }
}
function stopRec() {
  if (mediaRec && mediaRec.state === 'recording') { mediaRec.stop(); mic.classList.remove('rec'); }
}
mic.addEventListener('pointerdown', e => { e.preventDefault(); startRec(); });
mic.addEventListener('pointerup', stopRec);
mic.addEventListener('pointerleave', stopRec);

async function sendVoice(blob) {
  statusTo('TRANSCRIPTION…', 'think');
  const fd = new FormData();
  fd.append('file', blob, 'vocal.webm');
  try {
    // 1) STT seul : le texte s'affiche dès la transcription (pas d'attente cerveau)
    const r = await fetch('/api/stt', { method:'POST', headers: { 'X-Init-Data': INIT }, body: fd });
    if (r.status === 401) { addMsg('jarvis', '⚠️ Session Telegram invalide.'); return; }
    const j = await r.json();
    const heard = (j.transcription || '').trim();
    if (!heard) {
      addMsg('jarvis', "🎤 Je n'ai rien saisi — réessaie en parlant plus près du micro.");
      statusTo('RIEN ENTENDU — RÉESSAIE', 'think');
      return;
    }
    addMsg('me', '🎤 ' + heard);
    // 2) cerveau sur la transcription
    statusTo('TRAITEMENT…', 'think');
    await brain(heard, false);
  } catch (e) { addMsg('jarvis', '🔌 Vocal perdu. Réessaie.'); }
  statusTo('SYSTÈME OPÉRATIONNEL');
}

/* --- MODE CONTINU : l'œil de Jarvis suit la voix + écoute auto ---
   Le réacteur EST le vumètre : niveau RMS du micro → échelle + éclat de
   l'œil (montée rapide à la parole, retombée lente au silence). Si l'œil
   s'anime quand tu parles, le téléphone capte ta voix. Parole détectée →
   enregistrement ; silence de 2 s → envoi, réponse, puis réécoute en boucle. */
const contBtn = $('cont'), reactorEl = $('reactor');
let contOn = false, contStream = null, contAnalyser = null, contRAF = 0;
let contRec = null, contChunks = [], contState = 'listening';   // listening | busy
let noiseFloor = 0.006, speechStart = 0, lastVoice = 0, eyeLvl = 0;
const TD = new Uint8Array(512);

contBtn.onclick = () => contOn ? contStopAll() : contStart();

async function contStart() {
  unlockAudio();
  try {
    contStream = await navigator.mediaDevices.getUserMedia(
      { audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) { statusTo("MICRO REFUSÉ — AUTORISE L'ACCÈS", 'think'); return; }
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') { try { await actx.resume(); } catch (e) {} }
  const src = actx.createMediaStreamSource(contStream);
  contAnalyser = actx.createAnalyser(); contAnalyser.fftSize = 512;
  src.connect(contAnalyser);
  contOn = true; contBtn.classList.add('rec');
  contState = 'listening'; lastVoice = Date.now(); noiseFloor = 0.006; speechStart = 0; eyeLvl = 0;
  statusTo('MICRO DÉTECTÉ — PARLE, JE RÉPONDS APRÈS 2 S DE SILENCE', 'listen');
  loopVU();
}

function contStopAll() {
  if (contRec && contRec.state === 'recording') { try { contRec.stop(); } catch (e) {} }
  contRec = null;
  if (contStream) { contStream.getTracks().forEach(t => t.stop()); contStream = null; }
  cancelAnimationFrame(contRAF); contRAF = 0;
  contOn = false; speechStart = 0; eyeLvl = 0; mic.classList.remove('rec'); contBtn.classList.remove('rec');
  reactorEl.style.transform = ''; reactorEl.style.filter = '';
  contState = 'listening';
  if (!curSrc && !curAudio) statusTo('SYSTÈME OPÉRATIONNEL');
}

function rmsLevel() {
  contAnalyser.getByteTimeDomainData(TD);
  let s = 0;
  for (let i = 0; i < TD.length; i++) { const v = (TD[i] - 128) / 128; s += v * v; }
  return Math.sqrt(s / TD.length);
}

function loopVU() {
  if (!contOn) return;
  contRAF = requestAnimationFrame(loopVU);
  const rms = rmsLevel();
  const thr = Math.max(.02, noiseFloor * 3);
  if (rms < thr) noiseFloor = noiseFloor * .97 + rms * .03;   // plancher de bruit adaptatif
  /* l'œil EST le vumètre : échelle + éclat suivent le niveau vocal */
  const target = Math.min(1, rms / .12);
  eyeLvl += (target - eyeLvl) * (target > eyeLvl ? .45 : .08); // montée rapide, retombée lente
  reactorEl.style.transform = `scale(${(1 + eyeLvl * .22).toFixed(3)})`;
  reactorEl.style.filter = `brightness(${(1 + eyeLvl * 1.6).toFixed(2)}) saturate(${(1 + eyeLvl * .8).toFixed(2)})`;
  if (contState !== 'listening') return;     // pas de détection pendant que Jarvis parle/travaille
  if (rms > thr) {
    if (!speechStart) {                      // début de parole → on enregistre
      speechStart = Date.now(); lastVoice = speechStart; contChunks = [];
      try {
        contRec = new MediaRecorder(contStream);
        contRec.ondataavailable = e => contChunks.push(e.data);
        contRec.start();
      } catch (e) { contRec = null; }
      mic.classList.add('rec'); statusTo("🎤 J'ÉCOUTE…", 'listen');
    } else lastVoice = Date.now();
    if (Date.now() - speechStart > 30000) contFinish();       // garde-fou 30 s
  } else if (speechStart && Date.now() - lastVoice > 2000) contFinish();   // 2 s de silence
}

function contFinish() {
  const dur = Date.now() - speechStart; speechStart = 0;
  mic.classList.remove('rec');
  if (contRec) { const rec = contRec; contRec = null; try { rec.stop(); } catch (e) {} }
  if (dur < 700) { statusTo('TROP COURT — REPARLE', 'listen'); return; }
  contState = 'busy';
  const blob = new Blob(contChunks, { type: contChunks.length ? contChunks[0].type : 'audio/webm' });
  contChunks = [];
  contConversation(blob);
}

async function contConversation(blob) {
  statusTo('TRANSCRIPTION…', 'think');
  const fd = new FormData(); fd.append('file', blob, 'vocal.webm');
  try {
    const r = await fetch('/api/stt', { method: 'POST', headers: { 'X-Init-Data': INIT }, body: fd });
    if (r.status === 401) { addMsg('jarvis', '⚠️ Session Telegram invalide.'); contResume(); return; }
    const j = await r.json();
    const heard = (j.transcription || '').trim();
    if (!heard) {
      addMsg('jarvis', "🎤 Je n'ai rien saisi — réessaie en parlant plus près du micro.");
      statusTo('RIEN ENTENDU — REPARLE', 'listen');
      contResume(); return;
    }
    addMsg('me', '🎤 ' + heard);
    await brain(heard, false, () => contResume());
  } catch (e) { addMsg('jarvis', '🔌 Vocal perdu. Réessaie.'); contResume(); }
}

function contResume() {
  if (!contOn) { contStopAll(); return; }
  contState = 'listening'; lastVoice = Date.now(); speechStart = 0;
  if (!/^TOUCHE MA RÉPONSE/.test(status.textContent)) statusTo('MICRO ACTIF — JE RÉÉCOUTE', 'listen');
}

addMsg('jarvis', `Bonjour ${tg.initDataUnsafe?.user?.first_name || ''} 🤖\nSystèmes en ligne. Maintiens le micro pour me parler, active 🎧 pour la conversation en continu, ou écris.`);
statusTo('SYSTÈME OPÉRATIONNEL');
</script>
</body>
</html>
